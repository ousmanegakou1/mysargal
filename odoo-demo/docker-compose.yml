# MySargal — Odoo de démonstration (Odoo 17 + PostgreSQL)
# Le module MySargal Fidélité est monté automatiquement depuis ./addons
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db:/var/lib/postgresql/data

  odoo:
    image: odoo:17
    depends_on: [db]
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
    command: odoo --dev=reload

volumes:
  odoo-db:
  odoo-data:
