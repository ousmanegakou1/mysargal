function msThemeUI(){var t=document.documentElement.getAttribute('data-theme')||'dark';var b=document.getElementById('theme-fab');if(b)b.innerHTML='<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><use href="#ic-'+(t==='light'?'sun':'moon')+'"></use></svg>';var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='light'?'#eef3ef':'#061206');}
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme')||'dark';var n=(c==='light'?'dark':'light');document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('ms-theme',n);}catch(e){}msThemeUI();}

<script>
/* Devise de la boutique — le symbole et le nombre de décimales suivent le pays. */
var MS_DEVISES={XOF:{s:'FCFA',d:0},XAF:{s:'FCFA',d:0},NGN:{s:'₦',d:2},KES:{s:'KSh',d:2},
  TZS:{s:'TSh',d:0},RWF:{s:'FRw',d:0},UGX:{s:'USh',d:0},GHS:{s:'GH₵',d:2},
  ZAR:{s:'R',d:2},MAD:{s:'DH',d:2},DZD:{s:'DA',d:2},TND:{s:'DT',d:3},
  EUR:{s:'€',d:2},USD:{s:'US$',d:2},GBP:{s:'£',d:2},CAD:{s:'CA$',d:2},BRL:{s:'R$',d:2},
  // Huit monnaies manquaient : une carte lue depuis Banjul, Nouakchott,
  // Praia, Conakry, Bujumbura, Addis-Abeba, Lusaka ou Geneve retombait
  // silencieusement sur le franc CFA, et le client voyait un montant
  // libelle dans une monnaie qui n'a pas cours chez lui.
  GMD:{s:'D',d:2},MRU:{s:'UM',d:2},CVE:{s:'$',d:0},GNF:{s:'FG',d:0},
  BIF:{s:'FBu',d:0},ETB:{s:'Br',d:2},ZMW:{s:'ZK',d:2},CHF:{s:'CHF',d:2}};
var MS_DEVISE_AVANT={NGN:1,KES:1,TZS:1,RWF:1,UGX:1,GHS:1,ZAR:1,USD:1,GBP:1,CAD:1,BRL:1};
var MS_CUR='XOF';
function msFmtMontant(n,code){
  var c=code||MS_CUR||'XOF', d=MS_DEVISES[c]||MS_DEVISES.XOF;
  var v=new Intl.NumberFormat('fr-FR',{minimumFractionDigits:d.d,maximumFractionDigits:d.d}).format(Number(n)||0);
  return MS_DEVISE_AVANT[c]?(d.s+' '+v):(v+' '+d.s);
}
function isIOS(){return/iPad|iPhone|iPod/.test(navigator.userAgent)}
function isAndroid(){return/Android/i.test(navigator.userAgent)}
function initGCWallet(code, balance, merchantName, googleLink){
  var passUrl='https://iiocxlvcuoqafzlisqwd.supabase.co/functions/v1/get-apple-pass?code='+code;
  var cardUrl='https://mysargal.com/giftcard.html?code='+code;
  var wb=document.getElementById('gc-wa-btn');
  var ab=document.getElementById('gc-wallet-btn');
  var gb=document.getElementById('gc-google-btn');
  if(ab){
    ab.style.display='flex';
    ab.href=passUrl;
  }
  if(gb){
    gb.style.display='flex';
    gb.href=googleLink||('https://iiocxlvcuoqafzlisqwd.supabase.co/functions/v1/get-google-pass?code='+code);
  }
  if(wb){
    var bal=balance?msFmtMontant(balance):'';
    var msg='🎁 *Carte Cadeau MySargal*\n\n🏪 Boutique : *'+(merchantName||'MySargal')+'*\n💰 Solde : *'+bal+'*\n🎫 Code : '+code+'\n\n📲 Utiliser la carte :\n'+cardUrl+'\n\n💳 Vérifier le solde :\nhttps://mysargal.com/solde?c='+code;
    if(googleLink) msg += '\n\n📲 Ajouter à Google Wallet :\n'+googleLink;
    msg += '\n\n🍎 Ajouter à Apple Wallet :\n'+passUrl;
    wb.href='https://wa.me/?text='+encodeURIComponent(msg);
    wb.target='_blank';
  }
}
</script>

.modal-sub{font-size:.78rem;color:var(--tx3);margin-bottom:20px}
.modal-qr{background:#fff;border-radius:12px;padding:12px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px}
.modal-code{font-family:'DM Mono',monospace;font-size:1rem;font-weight:700;color:var(--green2);letter-spacing:.06em;margin-bottom:16px}
.btn-close{width:100%;padding:13px;border-radius:var(--r);border:1px solid var(--b2);background:var(--s3);color:var(--tx2);font-family:'Inter',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--s4);border:1px solid var(--b2);border-radius:var(--r);padding:9px 16px;font-size:.78rem;font-weight:500;animation:tIn .3s ease;white-space:nowrap;display:flex;align-items:center;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.ok{border-left:3px solid var(--green2);color:var(--green3)}
.toast.err{border-left:3px solid var(--red);color:#f87171}
@keyframes tIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn-wallet-gc{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#000;color:#fff;border:none;border-radius:12px;padding:14px 20px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;margin-top:10px;-webkit-tap-highlight-color:transparent}.btn-google-gc{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#fff;color:#000;border:1px solid #dadce0;border-radius:12px;padding:14px 20px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;margin-top:8px;-webkit-tap-highlight-color:transparent}.btn-wa-gc{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#25D366;color:#fff;border:none;border-radius:12px;padding:14px 20px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;margin-top:8px}.wallet-toast-gc{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:100px;font-size:14px;transition:transform .3s;z-index:9999;pointer-events:none}.wallet-toast-gc.show{transform:translateX(-50%) translateY(0)}
</style>

<script>
const SB_URL='https://iiocxlvcuoqafzlisqwd.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlpb2N4bHZjdW9xYWZ6bGlzcXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzNTgwODIsImV4cCI6MjA5MDkzNDA4Mn0.o-dRdHDGc5_IwCGhK5Ri67CCtZRj6J4evsxgBkMgvao';
const H={'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON};
let CARD=null,MERCHANT=null,TXNS=[];
const LABELS={violet:'Violet Mystère',gold:'Or Précieux',teal:'Turquoise',rose:'Rose Ardent',blue:'Bleu Profond',noir:'Noir Élégant',nuit:'Nuit Étoilée',foret:'Forêt Verte'};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtFCFA=n=>msFmtMontant(MS_DEVISES[MS_CUR]&&MS_DEVISES[MS_CUR].d?n:Math.round(n||0));
function fmtDT(iso){if(!iso)return'—';const d=new Date(iso),now=new Date(),diff=Math.floor((now-d)/86400000);if(diff===0){const dm=Math.floor((now-d)/60000);if(dm<2)return"À l'instant";if(dm<60)return'Il y a '+dm+' min';return"Auj. "+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}if(diff===1)return'Hier';if(diff<7)return'Il y a '+diff+' j';return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});}
function toast(msg,t='ok'){const w=document.getElementById('toasts'),el=document.createElement('div');el.className='toast '+t;el.textContent=msg;w.appendChild(el);setTimeout(()=>el.remove(),3200);}
function getCode(){const p=new URLSearchParams(location.search);return(p.get('code')||p.get('c')||'').toUpperCase()||null;}

// Applique la couleur de marque (montant, bouton Payer, accents, barre système)
let GIFT_BRAND=null;
function applyGiftBrand(b){
  try{
    if(!b||!b.bg2)return;
    GIFT_BRAND=b;
    const root=document.documentElement;
    root.style.setProperty('--green', b.bg2);
    root.style.setProperty('--green2', b.bg2);
    root.style.setProperty('--green3', b.accent||b.bg2);
    // Ambiance de fond + bordures teintées à la couleur de marque
    const hx=String(b.bg2).replace('#','');
    if(hx.length===6){
      const r=parseInt(hx.slice(0,2),16),g=parseInt(hx.slice(2,4),16),bl=parseInt(hx.slice(4,6),16);
      root.style.setProperty('--glow', `rgba(${r},${g},${bl},.14)`);
      root.style.setProperty('--b1', `rgba(${r},${g},${bl},.10)`);
      root.style.setProperty('--b2', `rgba(${r},${g},${bl},.18)`);
      root.style.setProperty('--b3', `rgba(${r},${g},${bl},.30)`);
    }
    const m=document.querySelector('meta[name=theme-color]');
    if(m && root.getAttribute('data-theme')!=='light' && b.bg1){ m.setAttribute('content', b.bg1); }
  }catch(e){}
}

function showError(title,sub,hint=''){
  document.getElementById('loading').style.display='none';
  const m=document.getElementById('main');m.style.display='flex';
  m.innerHTML=`<div class="error-wrap"><div class="error-icon" style="display:flex;justify-content:center"><svg viewBox="0 0 24 24" style="width:52px;height:52px;stroke:var(--tx3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><use href="#ic-gift"></use></svg></div><div class="error-title">${esc(title)}</div><div class="error-sub">${esc(sub)}</div>${hint?`<div class="error-hint">${esc(hint)}</div>`:''}</div>`;
}

async function load(){
  const code=getCode();
  if(!code){showError('Lien invalide',"Aucun code dans l'URL.",'Format : giftcard.html?code=GC-XXXXXX');return;}
  document.getElementById('hdr-code').textContent=code;
  try{
    // Lecture sécurisée via RPC public (les tables ne sont plus exposées en direct)
    const r=await fetch(`${SB_URL}/rest/v1/rpc/get_gift_public`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({p_code:code})});
    const gc=await r.json();
    if(!r.ok){
      showError('Erreur Supabase',gc?.message||'Erreur inconnue',`HTTP ${r.status}`);
      return;
    }
    if(!gc||!gc.code){
      showError('Carte introuvable',`Code "${code}" non trouvé.`,'Vérifie le lien reçu ou contacte la boutique.');
      return;
    }
    CARD=gc;
    MERCHANT=gc.merchant||null;
    MS_CUR=(gc.currency)||(MERCHANT&&MERCHANT.currency)||'XOF';
    if(!MS_DEVISES[MS_CUR]) MS_CUR='XOF';
    TXNS=Array.isArray(gc.transactions)?gc.transactions:[];
    // Couleur de marque : depuis le RPC si présente, sinon get_gift_brand, sinon vert MySargal
    try{
      let brand=(MERCHANT&&MERCHANT.brand&&MERCHANT.brand.bg1)?MERCHANT.brand:null;
      if(!brand){
        const bj=await fetch(`${SB_URL}/rest/v1/rpc/get_gift_brand`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({p_code:code})}).then(r=>r.json());
        if(bj&&typeof bj==='object'&&bj.bg1) brand=bj;
      }
      if(brand) applyGiftBrand(brand);
    }catch(e){}
    render();
  }catch(e){showError('Erreur réseau',e.message||String(e),'Vérifie ta connexion et réessaie.');}
}

function render(){
  document.getElementById('loading').style.display='none';
  const main=document.getElementById('main');main.style.display='flex';
  const d=CARD.design||'violet';
  const init=CARD.initial_amount||0;
  const bal=CARD.balance||0;
  const pct=init>0?Math.min(100,Math.round((bal/init)*100)):0;
  const active=CARD.status==='active'&&bal>0;
  const cancelled=CARD.status==='cancelled';
  const validity=CARD.expires_at?new Date(CARD.expires_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}):'Sans expiration';
  const sKey=active?'active':cancelled?'cancelled':'used';
  const sLabel=active?'● Carte active':cancelled?'✕ Annulée':'✓ Soldée';
  const faceBg = CARD.design_url
    ? `background-image:url(${CARD.design_url});background-size:cover;background-position:center`
    : ((GIFT_BRAND&&GIFT_BRAND.bg1) ? `background:linear-gradient(135deg,${GIFT_BRAND.bg1},${GIFT_BRAND.bg2})` : '');
  main.innerHTML=`
    <div class="card-scene"><div class="gc-float"><div class="gc-tilt" id="gc-tilt"><div class="card-3d" id="card3d" onclick="flipCard()">
      <div class="card-face gc-${esc(d)} cf" style="${faceBg}">
        <div class="shimmer"></div>
        ${!CARD.hide_overlay?`
        <div class="cf-top">
          ${(()=>{
            const logo=MERCHANT?.logo_url||MERCHANT?.logo_base64;
            return `<div style="max-height:40px;max-width:130px;border-radius:${logo?'0':'8px'};overflow:hidden;background:${logo?'transparent':'rgba(255,255,255,.15)'};display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:900;color:#fff;font-size:1rem;flex-shrink:0">${logo?`<img src="${logo}" style="height:40px;max-width:130px;width:auto;object-fit:contain;display:block"/>`:(MERCHANT?.name||'M')[0].toUpperCase()}</div>`;
          })()}
        </div>
        <div>
          ${CARD.message?`<div class="cf-msg">${esc(CARD.message)}</div>`:''}
          <div class="cf-amount">${fmtFCFA(bal)}</div>
          <div class="cf-for">${CARD.recipient_name?'Pour '+esc(CARD.recipient_name):LABELS[d]||''}</div>
          <div class="cf-prog"><div class="cf-prog-fill" style="width:${pct}%"></div></div>
          <div style="display:flex;align-items:flex-end;justify-content:space-between">
            <div class="cf-code">${esc(CARD.code)}</div>
            <div class="cf-logo">My<em>Sargal</em></div>
          </div>
        </div>`:''}
      </div>
      <div class="card-face gc-${esc(d)} cb" style="${faceBg}">
        <div class="shimmer"></div>
        ${!CARD.hide_overlay?`<div class="cb-label">Scanner pour payer</div>`:''}
        <div class="cb-qr"><div id="back-qr"></div></div>
        <div class="cb-code" style="margin-top:6px">${esc(CARD.code)}</div>
      </div>
    </div></div></div></div>
    <div class="flip-hint"><svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-1px;margin-right:4px"><use href="#ic-refresh"></use></svg>Touche la carte pour voir le QR</div>
    ${sKey!=='active'?`<div class="status-chip s-${sKey}">${sLabel}</div>`:''}
    <div class="balance-card">
      <div class="bal-label">Solde disponible</div>
      <div class="bal-amount">${fmtFCFA(bal)}</div>
      <div class="bal-initial">sur ${fmtFCFA(init)} initial</div>
      <div class="bal-row"><div class="bal-vlbl">Validité</div><div class="bal-vval">${validity}</div></div>
      <div class="bal-prog"><div class="bal-prog-fill" style="width:${pct}%"></div></div>
      <div class="bal-ends"><span class="bal-lbl">0</span><span class="bal-lbl">${fmtFCFA(init)}</span></div>
      <a href="/solde?c=${esc(CARD.code)}" style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;padding:11px;border-radius:12px;background:var(--s3,rgba(255,255,255,.04));border:1px solid var(--b2);color:var(--tx2,#9fb6a3);text-decoration:none;font-size:.82rem;font-weight:600"><svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><use href="#ic-card"></use></svg>Vérifier mon solde à tout moment</a>
    </div>
    ${MERCHANT?`<div class="merchant-bar"><div class="merch-av">${(MERCHANT.name||'?')[0]}</div><div><div class="merch-name">${esc(MERCHANT.name)}</div><div class="merch-sub">Valable chez ce commerçant</div></div></div>`:''}
    <div class="actions">
      <button class="act-btn act-pay" onclick="openPayModal()"><span class="act-icon" style="display:flex"><svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><use href="#ic-card"></use></svg></span><span>Payer en caisse</span></button>
      <a id="gc-wallet-btn" class="btn-wallet-gc" href="#" style="display:none"><svg width="20" height="20" viewBox="0 0 22 22" fill="none"><path d="M16.5 11.55c-.02-2.1 1.71-3.1 1.79-3.16-.98-1.43-2.5-1.63-3.04-1.65-1.3-.13-2.54.76-3.2.76-.66 0-1.68-.74-2.77-.72-1.42.02-2.74.83-3.47 2.1-1.49 2.57-.38 6.38 1.06 8.47.71 1.02 1.55 2.16 2.65 2.12 1.07-.04 1.47-.69 2.77-.69 1.29 0 1.65.69 2.78.67 1.14-.02 1.87-1.03 2.57-2.06.81-1.17 1.14-2.31 1.16-2.37-.03-.01-2.28-.87-2.3-3.47z" fill="white"/><path d="M14.32 5.13c.59-.71.98-1.7.87-2.69-.84.03-1.86.56-2.47 1.26-.54.62-1.01 1.62-.88 2.58.93.07 1.88-.47 2.48-1.15z" fill="white"/></svg> Ajouter à Apple Wallet</a>
      <a id="gc-google-btn" class="btn-google-gc" href="#" style="display:none" target="_blank"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285f4" d="M22.5 12.27c0-.79-.07-1.54-.2-2.27H12v4.51h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.32z"/><path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fbbc04" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Ajouter à Google Wallet</a>
      <a id="gc-wa-btn" class="btn-wa-gc" href="#"><svg width="18" height="18" fill="white" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg> Partager par WhatsApp</a>
      <div class="wallet-toast-gc" id="gc-toast"></div>
      <button class="act-btn act-offer" onclick="offerCard()"><span class="act-icon" style="display:flex"><svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><use href="#ic-chat"></use></svg></span><span>Offrir via WhatsApp</span></button>
    </div>
    <div class="sec-hdr"><div class="sec-title">Historique</div><div class="sec-sub">${TXNS.length} transaction${TXNS.length!==1?'s':''}</div></div>
    <div class="hist-list" id="hist-list"></div>`;
  initGCWallet(CARD.code, CARD.balance, CARD.merchant?.name || CARD.merchant_name || 'MySargal', CARD.google_wallet_link);
  try{var _tl=document.getElementById('gc-tilt');if(_tl){_tl.addEventListener('pointermove',function(ev){var r=_tl.getBoundingClientRect();var px=(ev.clientX-r.left)/r.width-0.5,py=(ev.clientY-r.top)/r.height-0.5;_tl.style.transform='rotateY('+(px*9).toFixed(2)+'deg) rotateX('+(-py*9).toFixed(2)+'deg)';});_tl.addEventListener('pointerleave',function(){_tl.style.transform='';});}}catch(e){}
  setTimeout(()=>{const el=document.getElementById('back-qr');if(el){try{new QRCode(el,{text:CARD.code,width:100,height:100,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});}catch(e){el.innerHTML='<div style="width:100px;height:100px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;color:#333;padding:6px;text-align:center;word-break:break-all">'+CARD.code+'</div>';}}},100);
  renderHistory();
  try{ msMaybeReveal(); }catch(e){}
}

function msMaybeReveal(){
  if(!CARD) return;
  var isGift = CARD.recipient_name || CARD.message;
  if(!isGift) return;
  try{ if(localStorage.getItem('ms_gift_opened_'+CARD.code)==='1') return; }catch(e){}
  var ov=document.getElementById('gift-reveal'); if(!ov) return;
  var parts=[];
  if(CARD.recipient_name) parts.push('Pour <b>'+esc(CARD.recipient_name)+'</b>');
  if(CARD.message) parts.push('«&nbsp;'+esc(CARD.message)+'&nbsp;»');
  var msg=document.getElementById('gr-msg'); if(msg) msg.innerHTML=parts.join('<br>');
  ov.classList.add('show');
}
function msGiftConfetti(){
  var box=document.getElementById('gr-confetti'); if(!box) return;
  var cs=['#22c55e','#16a34a','#f5c842','#ffffff','#4ade80','#a78bfa'];
  for(var i=0;i<42;i++){ (function(k){
    var d=document.createElement('div'); d.className='gr-conf';
    d.style.left=(Math.random()*100)+'vw'; d.style.background=cs[k%cs.length];
    d.style.animationDuration=(1+Math.random()*1.1)+'s'; d.style.animationDelay=(Math.random()*0.3)+'s';
    d.style.transform='rotate('+(Math.random()*360)+'deg)';
    box.appendChild(d); setTimeout(function(){d.remove();},2500);
  })(i); }
}
function msOpenGift(){
  var ov=document.getElementById('gift-reveal'); if(!ov||ov.classList.contains('open')) return;
  ov.classList.add('open'); msGiftConfetti();
  try{ if(navigator.vibrate) navigator.vibrate([20,40,30]); }catch(e){}
  try{ if(CARD) localStorage.setItem('ms_gift_opened_'+CARD.code,'1'); }catch(e){}
  setTimeout(function(){ ov.classList.add('done'); setTimeout(function(){ ov.classList.remove('show','open','done'); }, 600); }, 1150);
}

function renderHistory(){
  const el=document.getElementById('hist-list');if(!el)return;
  if(!TXNS.length){el.innerHTML='<div class="empty"><div class="empty-icon" style="display:flex;justify-content:center"><svg viewBox="0 0 24 24" style="width:32px;height:32px;stroke:var(--tx3);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><use href="#ic-clipboard"></use></svg></div><div class="empty-txt">Aucune transaction</div></div>';return;}
  el.innerHTML=TXNS.map(t=>{const credit=t.type==='credit'||t.amount>0;return`<div class="hi"><div class="hi-ico ${credit?'credit':'debit'}"><svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:${credit?'var(--green2)':'var(--red)'};fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><use href="#${credit?'ic-coins':'ic-bag'}"></use></svg></div><div class="hi-info"><div class="hi-title">${esc(t.note||t.type||'Transaction')}</div><div class="hi-meta">${fmtDT(t.created_at)}</div></div><div class="hi-amt ${credit?'amt-p':'amt-m'}">${credit?'+':''}${fmtFCFA(Math.abs(t.amount))}</div></div>`;}).join('');
}

function flipCard(){document.getElementById('card3d')?.classList.toggle('flipped');}

function openPayModal(){
  if(!CARD)return;
  document.getElementById('pay-modal').classList.add('open');
  document.getElementById('modal-code-txt').textContent=CARD.code;
  const el=document.getElementById('modal-qr-el');el.innerHTML='';
  setTimeout(()=>{try{new QRCode(el,{text:CARD.code,width:180,height:180,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});}catch(e){el.innerHTML='<div style="width:180px;height:180px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;color:#333;padding:10px;text-align:center;word-break:break-all">'+CARD.code+'</div>';}},50);
}

function closeModal(){document.getElementById('pay-modal').classList.remove('open');}
function offerCard(){
  if(!CARD)return;
  const url='https://mysargal.com/giftcard.html?code='+CARD.code;
  const who=CARD.recipient_name?(' '+CARD.recipient_name):'';
  const m=(CARD.merchant&&CARD.merchant.name)||CARD.merchant_name||'';
  let msg='🎁 Surprise'+who+' !\n\nTu as reçu une carte cadeau de *'+fmtFCFA(CARD.balance)+'*'+(m?' chez *'+m+'*':'')+'.';
  if(CARD.message) msg+='\n\n« '+CARD.message+' »';
  msg+='\n\n👉 Ouvre ton cadeau ici :\n'+url+'\n\n— MySargal';
  window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(msg),'_blank');
}
document.getElementById('pay-modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
load();
</script>
</body>
