<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Motif MARAZ">
  <defs>
    <pattern id="maraz-motif" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <g fill="#1e3a5f" fill-opacity="0.08" stroke="#1e3a5f" stroke-opacity="0.08" stroke-width="1">
        <polygon points="40,20 60,60 20,60" fill-opacity="0.08"/>
        <polygon points="140,40 160,80 120,80" fill-opacity="0.08"/>
        <polygon points="90,110 110,150 70,150" fill-opacity="0.08"/>
        <polygon points="170,140 190,180 150,180" fill-opacity="0.08"/>
        <polygon points="20,150 40,190 0,190" fill-opacity="0.08"/>
        <line x1="0" y1="100" x2="200" y2="100" stroke-dasharray="4 8"/>
        <line x1="100" y1="0" x2="100" y2="200" stroke-dasharray="4 8"/>
      </g>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#maraz-motif)"/>
</svg>
