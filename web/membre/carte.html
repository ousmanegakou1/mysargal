<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#1e3a5f"/>
<title>Ma carte digitale — Summit Club</title>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --marine:#1e3a5f;
  --marine2:#2b4b74;
  --orange:#c85a3e;
  --creme:#f3ede0;
  --creme2:#e8dfc9;
  --ink:#12233a;
  --ink2:#5a6a7d;
  --line:rgba(30,58,95,.14);
}
html,body{background:var(--creme);color:var(--ink);font-family:-apple-system,"Helvetica Neue","Inter",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
body{padding:20px 16px 60px;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:520px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)}
.top-bar a{color:var(--marine);text-decoration:none;font-weight:600}

/* CARD */
.card-flip{perspective:1200px;margin:10px auto 22px;width:100%;max-width:420px}
.card-inner{position:relative;width:100%;aspect-ratio:1.586/1;transition:transform .8s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 22px 60px rgba(30,58,95,.28)}
.card-back{transform:rotateY(180deg)}

.card-front{background:linear-gradient(140deg,var(--marine) 0%,var(--marine2) 55%,#3a5f8a 100%);color:var(--creme);padding:22px 22px 18px;display:flex;flex-direction:column;justify-content:space-between}
.card-front::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(200,90,62,.5),transparent 65%);pointer-events:none}
.card-front::after{content:"";position:absolute;left:-40px;bottom:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(243,237,224,.10),transparent 65%);pointer-events:none}
.cf-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cf-brand{font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:8px}
.cf-brand .cf-logo{display:none;height:36px;width:auto}
.cf-brand.has-logo .cf-brand-text{display:none}
.cf-brand.has-logo .cf-logo{display:block}
.cf-tier{padding:5px 12px;border-radius:20px;background:rgba(243,237,224,.16);border:1px solid rgba(243,237,224,.32);font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;font-weight:700}
.cf-tier-img{display:none;height:56px;width:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.28))}
.cf-tier-slot.has-img .cf-tier{display:none}
.cf-tier-slot.has-img .cf-tier-img{display:block}
.cf-mid{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;margin:6px 0}
.cf-kick{font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:var(--creme2)}
.cf-name{font-size:1.55rem;font-weight:700;letter-spacing:.1em;color:var(--creme);margin-top:6px;text-transform:capitalize}
.cf-tier-line{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--orange);font-weight:700;margin-top:6px}
.cf-foot{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end}
.cf-no{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--creme2)}
.cf-no b{color:var(--creme);font-family:"SF Mono",Menlo,monospace;letter-spacing:.14em;font-weight:600}
.cf-since{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--creme2);text-align:right}

.card-back{background:var(--creme);color:var(--ink);padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative}
.card-back::before{content:"";position:absolute;inset:0;background-image:url('/membre/assets/motif-fond.svg');background-repeat:repeat;background-size:180px 180px;opacity:.6;pointer-events:none}
.card-back > *{position:relative;z-index:1}
.card-back .qr-box{background:#fff;padding:14px;border-radius:12px;border:1px solid var(--line);box-shadow:0 6px 16px rgba(30,58,95,.08)}
.card-back .code{font-family:"SF Mono",Menlo,monospace;font-size:.78rem;letter-spacing:.18em;color:var(--marine);font-weight:600}
.card-back .cb-brand{font-size:.58rem;letter-spacing:.32em;text-transform:uppercase;color:var(--marine);font-weight:700;margin-top:4px}
.card-back .tc{font-size:.6rem;color:var(--ink2);letter-spacing:.08em;text-align:center;line-height:1.4;max-width:280px}

.flip-hint{text-align:center;font-size:.68rem;color:var(--ink2);letter-spacing:.22em;text-transform:uppercase;margin-bottom:20px;cursor:pointer}
.flip-hint b{color:var(--orange)}

/* Actions */
.actions{display:grid;grid-template-columns:1fr;gap:10px;max-width:420px;margin:0 auto}
.actions button,.actions a{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 18px;border-radius:26px;font-size:.76rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;border:none;text-decoration:none;font-family:inherit;cursor:pointer}
.act-apple{background:#000;color:#fff}
.act-google{background:#fff;color:#3c4043;border:1.5px solid #dadce0 !important}
.act-pdf{background:var(--orange);color:var(--creme)}
.act-share{background:transparent;color:var(--marine);border:1.5px solid var(--marine) !important}

.foot{text-align:center;font-size:.66rem;color:var(--ink2);letter-spacing:.18em;text-transform:uppercase;margin-top:30px}
.foot b{color:var(--marine)}

.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.32);border-top-color:currentColor;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.msg{margin-top:14px;padding:11px;border-radius:8px;font-size:.8rem;text-align:center;letter-spacing:.04em;display:none}
.msg.err{background:rgba(178,58,58,.10);color:#b23a3a;display:block}
.msg.ok{background:rgba(58,122,85,.10);color:#3a7a55;display:block}

.loading-mask{position:fixed;inset:0;background:var(--creme);display:flex;align-items:center;justify-content:center;z-index:10;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2)}
.loading-mask.hide{display:none}

@media print{
  @page{size:85mm 54mm;margin:0}
  body{background:#fff;padding:0}
  .top-bar,.flip-hint,.actions,.foot,.loading-mask{display:none !important}
  .wrap,.card-flip{max-width:none;margin:0}
  .card-inner{aspect-ratio:auto;height:54mm;width:85mm}
  .card-inner.flipped{transform:none}
  .card-face{box-shadow:none;border-radius:0}
  .card-back{display:none}
}
</style>
</head>
<body>

<div class="loading-mask" id="loading">Chargement...</div>

<div class="wrap">
  <div class="top-bar">
    <a href="/membre/">Retour</a>
    <span id="brand-label">Summit Club</span>
  </div>

  <div class="card-flip">
    <div class="card-inner" id="card-inner">
      <div class="card-face card-front" id="card-front">
        <div class="cf-top">
          <div class="cf-brand" id="cf-brand">
            <img class="cf-logo" id="cf-logo" alt=""/>
            <span class="cf-brand-text" id="cf-brand-text">MARAZ</span>
          </div>
          <div class="cf-tier-slot" id="cf-tier-slot">
            <img class="cf-tier-img" id="cf-tier-img" alt=""/>
            <div class="cf-tier" id="cf-tier">-</div>
          </div>
        </div>
        <div class="cf-mid">
          <div class="cf-kick" id="cf-kick">Summit Club</div>
          <div class="cf-name" id="cf-name">-</div>
          <div class="cf-tier-line" id="cf-tier-line"></div>
        </div>
        <div class="cf-foot">
          <div class="cf-no">Membre <b id="cf-no">-</b></div>
          <div class="cf-since" id="cf-since"></div>
        </div>
      </div>
      <div class="card-face card-back" id="card-back">
        <div class="qr-box" id="qr-box"></div>
        <div class="code" id="qr-code">-</div>
        <div class="tc">Carte personnelle et incessible. Presenter en caisse pour toute reconnaissance de points.</div>
        <div class="cb-brand" id="cb-brand">MARAZ Summit Club</div>
      </div>
    </div>
  </div>

  <div class="flip-hint" id="flip-hint">Touche pour <b>retourner la carte</b></div>

  <div class="actions">
    <button class="act-apple" id="btn-apple">Ajouter a Apple Wallet</button>
    <button class="act-google" id="btn-google">Ajouter a Google Wallet</button>
    <button class="act-pdf" id="btn-pdf"><span id="pdf-lbl">Telecharger la carte PDF</span></button>
    <button class="act-share" id="btn-print">Imprimer la carte</button>
  </div>

  <div class="msg" id="msg"></div>

  <div class="foot">Propulse par My<b>Sargal</b></div>
</div>

<script>
(function(){
  var SB_URL='https://iiocxlvcuoqafzlisqwd.supabase.co';
  var SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlpb2N4bHZjdW9xYWZ6bGlzcXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzNTgwODIsImV4cCI6MjA5MDkzNDA4Mn0.o-dRdHDGc5_IwCGhK5Ri67CCtZRj6J4evsxgBkMgvao';
  var Q=new URLSearchParams(location.search);
  var SLUG=(Q.get('m')||'maraz').toLowerCase().replace(/[^a-z0-9-]/g,'')||'maraz';
  var TOK_KEY='member_token_'+SLUG;
  var TOKEN=null;var MEMBER=null;
  try{TOKEN=localStorage.getItem(TOK_KEY)||null}catch(e){}
  if(!TOKEN){location.replace('/membre/?m='+encodeURIComponent(SLUG));return}

  function $(id){return document.getElementById(id)}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function msg(txt,ok){var e=$('msg');e.className='msg '+(ok?'ok':'err');e.textContent=txt||''}

  var THEMES={maraz:{marine:'#1e3a5f',orange:'#c85a3e',creme:'#f3ede0',name:'MARAZ',kicker:'Summit Club',logo:'/membre/assets/maraz-logo.svg'}};
  var THEME=THEMES[SLUG]||{marine:'#1e3a5f',orange:'#c85a3e',creme:'#f3ede0',name:'MEMBRE',kicker:'Espace Premium',logo:''};
  document.documentElement.style.setProperty('--marine',THEME.marine);
  document.documentElement.style.setProperty('--orange',THEME.orange);
  document.documentElement.style.setProperty('--creme',THEME.creme);
  var mt=document.querySelector('meta[name=theme-color]');if(mt)mt.setAttribute('content',THEME.marine);
  $('cf-brand-text').textContent=THEME.name;
  $('cf-kick').textContent=THEME.kicker;
  $('brand-label').textContent=THEME.kicker;
  $('cb-brand').textContent=(THEME.name||'')+' '+(THEME.kicker||'');
  // Logo top-left (SVG). Fallback : le texte "MARAZ" reste visible si l image echoue.
  if(THEME.logo){
    var lg=$('cf-logo');
    lg.onload=function(){$('cf-brand').classList.add('has-logo')};
    lg.onerror=function(){$('cf-brand').classList.remove('has-logo')};
    lg.src=THEME.logo;
  }

  function slugifyTier(name){
    if(!name)return '';
    return String(name).toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  }

  // Flip
  $('card-inner').addEventListener('click',function(){$('card-inner').classList.toggle('flipped')});
  $('flip-hint').addEventListener('click',function(){$('card-inner').classList.toggle('flipped')});

  async function loadMe(){
    try{
      var r=await fetch(SB_URL+'/functions/v1/api-member?action=me&slug='+encodeURIComponent(SLUG),{
        method:'GET',credentials:'omit',
        headers:{'apikey':SB_ANON,'Authorization':'Bearer '+TOKEN}
      });
      if(r.status===401){try{localStorage.removeItem(TOK_KEY)}catch(e){}location.replace('/membre/?m='+encodeURIComponent(SLUG));return}
      var d=await r.json();
      if(!r.ok||d.error)throw new Error(d.error||'Erreur');
      MEMBER=d;render(d);
    }catch(e){msg('Impossible de charger : '+e.message)}
    finally{$('loading').classList.add('hide')}
  }

  function render(d){
    var mer=d.merchant||{};
    if(mer.color){document.documentElement.style.setProperty('--marine',mer.color)}
    if(mer.name){$('cf-brand-text').textContent=mer.name.toUpperCase()}
    var t=d.tier||{};
    var tierName=(t.name||'').toUpperCase();
    $('cf-tier').textContent=tierName||'-';
    $('cf-tier-line').textContent=tierName;
    // Sur MARAZ, tenter la badge SVG dediee (fallback = pill texte)
    var tierSlug=slugifyTier(t.name);
    if(SLUG==='maraz' && tierSlug){
      var ti=$('cf-tier-img'), slot=$('cf-tier-slot');
      ti.onload=function(){slot.classList.add('has-img')};
      ti.onerror=function(){slot.classList.remove('has-img')};
      ti.alt=t.name||'';
      ti.src='/membre/assets/tier-badge-'+tierSlug+'.svg';
    }
    // Prenom seul centre - c est le brief pour la carte MARAZ
    $('cf-name').textContent=d.first_name||[d.first_name,d.last_name].filter(Boolean).join(' ')||'Membre';
    $('cf-no').textContent=d.member_number||'-';
    if(d.member_since){
      try{$('cf-since').textContent='Membre depuis '+new Date(d.member_since).getFullYear()}catch(e){}
    }
    var code=d.card_code||d.member_number||'';
    $('qr-code').textContent=code;
    var box=$('qr-box');box.innerHTML='';
    if(window.QRCode&&code){
      new QRCode(box,{text:code,width:200,height:200,colorDark:'#1e3a5f',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
    }
  }

  // ---- Actions ----
  $('btn-apple').addEventListener('click',async function(){
    if(!MEMBER){return}
    var code=MEMBER.card_code||MEMBER.member_number;
    if(!code){msg('Code carte introuvable.');return}
    var btn=this;btn.disabled=true;var orig=btn.textContent;btn.innerHTML='<span class="spin"></span>';
    try{
      var url=SB_URL+'/functions/v1/get-apple-pass?code='+encodeURIComponent(code);
      var r=await fetch(url,{method:'GET',credentials:'omit',headers:{'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON}});
      if(!r.ok){location.href=url;return}
      var blob=await r.blob();
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='carte-summit-club.pkpass';document.body.appendChild(a);a.click();a.remove();
      msg('Carte Apple Wallet telechargee. Ouvre le fichier pour l\'ajouter.',true);
    }catch(e){msg('Impossible : '+e.message)}
    finally{btn.disabled=false;btn.textContent=orig}
  });

  $('btn-google').addEventListener('click',async function(){
    if(!MEMBER){return}
    var code=MEMBER.card_code||MEMBER.member_number;
    if(!code){msg('Code carte introuvable.');return}
    var btn=this;btn.disabled=true;var orig=btn.textContent;btn.innerHTML='<span class="spin"></span>';
    try{
      var r=await fetch(SB_URL+'/functions/v1/get-google-pass?code='+encodeURIComponent(code),{
        method:'GET',credentials:'omit',
        headers:{'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON}
      });
      var d=await r.json();
      if(!r.ok||!d.save_url)throw new Error(d.error||'Erreur Google Wallet');
      location.href=d.save_url;
    }catch(e){msg('Impossible : '+e.message);btn.disabled=false;btn.textContent=orig}
  });

  $('btn-print').addEventListener('click',function(){window.print()});

  $('btn-pdf').addEventListener('click',async function(){
    if(!MEMBER){return}
    var btn=this,lbl=$('pdf-lbl');btn.disabled=true;lbl.innerHTML='<span class="spin"></span>';
    try{
      var flipped=$('card-inner').classList.contains('flipped');
      $('card-inner').classList.remove('flipped');
      await new Promise(function(res){setTimeout(res,50)});

      var frontEl=$('card-front');
      var backEl=$('card-back');

      var frontCanvas=await html2canvas(frontEl,{scale:3,backgroundColor:null,useCORS:true,logging:false});
      // Temporarily un-hide back for capture
      var origPos=backEl.style.position, origVis=backEl.style.visibility, origTr=backEl.style.transform;
      backEl.style.position='fixed';backEl.style.left='-9999px';backEl.style.top='0';backEl.style.transform='none';backEl.style.visibility='visible';
      var backCanvas=await html2canvas(backEl,{scale:3,backgroundColor:'#f3ede0',useCORS:true,logging:false});
      backEl.style.position=origPos;backEl.style.left='';backEl.style.top='';backEl.style.transform=origTr;backEl.style.visibility=origVis;

      var jsPDFCtor=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
      var pdf=new jsPDFCtor({unit:'mm',format:[85,54],orientation:'landscape'});
      pdf.addImage(frontCanvas.toDataURL('image/png'),'PNG',0,0,85,54,undefined,'FAST');
      pdf.addPage([85,54],'landscape');
      pdf.addImage(backCanvas.toDataURL('image/png'),'PNG',0,0,85,54,undefined,'FAST');
      var fname='carte-'+(MEMBER.member_number||'membre')+'.pdf';
      pdf.save(fname);

      if(flipped)$('card-inner').classList.add('flipped');
      msg('PDF genere.',true);
    }catch(e){msg('Impossible : '+e.message)}
    finally{btn.disabled=false;lbl.textContent='Telecharger la carte PDF'}
  });

  loadMe();
})();
</script>
</body>
</html>
