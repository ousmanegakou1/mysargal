<script>
function initLCWallet(code, pts, threshold, merchantName, clientName, googleLink){
  var passUrl=SB_URL+'/functions/v1/get-apple-pass?code='+code;
  var cardUrl='https://mysargal.com/c/?code='+code;
  var ab=document.getElementById('lc-wallet-btn');
  var wb=document.getElementById('lc-wa-btn');
  var gb=document.getElementById('lc-google-btn');
  if(ab){
    ab.href=passUrl;
  }
  if(gb){
    gb.style.display='flex';
    gb.href = googleLink || (SB_URL+'/functions/v1/get-google-pass?code='+code);
  }
  var rb=document.getElementById('lc-ref-btn');
  if(rb){
    var rmsg='🤝 Salut ! Je suis client(e) chez *'+(merchantName||'cette boutique')+'* et je cumule des points avec MySargal.\n\nRejoins-moi : à ta première visite, donne mon *code parrain* en caisse et on gagne *tous les deux* des points bonus 🎁\n\n🎫 Mon code parrain : *'+code+'*\n\nÀ bientôt !';
    rb.href='https://wa.me/?text='+encodeURIComponent(rmsg);
    rb.target='_blank';
  }
  if(wb){
    var msg='🏆 *Ma carte fidélité MySargal*\n\n🏪 Boutique : *'+(merchantName||'MySargal')+'*\n⭐ Points : *'+(pts||0)+'/'+(threshold||10)+'*\n👤 '+(clientName||'')+'\n🎫 Code : '+code+'\n\n📲 Voir ma carte :\n'+cardUrl;
    if(googleLink) msg += '\n\n📲 Ajouter à Google Wallet :\n'+googleLink;
    msg += '\n\n🍎 Ajouter à Apple Wallet :\n'+passUrl;
    wb.href='https://wa.me/?text='+encodeURIComponent(msg);
    wb.target='_blank';
  }
}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#061206;--s1:#0a1a0a;--s2:#0f240f;--s3:#152e15;--b1:rgba(34,197,94,.08);--b2:rgba(34,197,94,.16);--b3:rgba(34,197,94,.28);--tx:#ecf5ec;--tx2:#7aaa7a;--tx3:#3a5e3a;--green:#16a34a;--green2:#22c55e;--green3:#4ade80;--gold:#f5c842;--gold2:#fde68a;--r:14px;--r2:20px;--r3:28px;--logo-box:#f3faf3;--logo-ink:#0a2810;--card-sh:none;--glow:rgba(22,163,74,.12);color-scheme:dark}
html[data-theme="light"]{--bg:#eef3ef;--s1:#ffffff;--s2:#ffffff;--s3:#f1f6f1;--b1:rgba(22,163,74,.10);--b2:rgba(22,163,74,.16);--b3:rgba(22,163,74,.30);--tx:#12241a;--tx2:#557056;--tx3:#9bb3a0;--green2:#16a34a;--green3:#15803d;--gold:#c98a04;--gold2:#8f5e07;--logo-box:#0a0f0b;--logo-ink:#ffffff;--card-sh:0 6px 20px rgba(20,45,28,.08);--glow:rgba(22,163,74,.07);color-scheme:light}
html{transition:background .25s ease}
.stats,.qr-section,.cta-ghost,.reward-banner{box-shadow:var(--card-sh)}
.loader-logo-svg{height:108px;width:auto;display:block;filter:drop-shadow(0 10px 30px rgba(0,0,0,.4));animation:popIn .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes popIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.logo-sm{display:flex;align-items:center}
.logo-sm .topbar-logo{height:28px;width:auto;display:block}
.theme-fab{width:34px;height:34px;border-radius:10px;background:var(--s2);border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;font-size:.92rem;cursor:pointer;color:var(--tx2);flex-shrink:0;transition:transform .15s,background .2s}
.theme-fab:active{transform:scale(.92)}
html,body{min-height:100svh;background:var(--bg)}
body{font-family:'Inter',sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg::before{content:'';position:absolute;top:-20vh;left:50%;transform:translateX(-50%);width:100vw;height:100vw;background:radial-gradient(circle,var(--glow) 0%,transparent 65%)}
.app{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;padding:0 0 40px}
#loader{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s}
#loader.hide{opacity:0;pointer-events:none}
.loader-logo{font-family:'Montserrat',sans-serif;font-size:2rem;font-weight:900}
.loader-logo em{color:var(--green2);font-style:normal}
.loader-bar{width:160px;height:2px;background:var(--s3);border-radius:2px;overflow:hidden}
.loader-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green2));animation:lf 1.2s ease forwards}
@keyframes lf{from{width:0}to{width:100%}}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:max(env(safe-area-inset-top),16px) 20px 0}
.logo-sm{font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:900}
.logo-sm em{color:var(--green2);font-style:normal}
.card-wrap{padding:20px}
.lc-scene{perspective:1300px}
.lc-3d{position:relative;width:100%;aspect-ratio:1.62;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.2,1);cursor:pointer;border-radius:22px;box-shadow:0 14px 50px rgba(0,0,0,.45)}
.lc-3d.flipped{transform:rotateY(180deg)}
.lc{border-radius:22px;padding:20px 22px;position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .2s ease .25s}
.lc-verso{transform:rotateY(180deg);align-items:center;justify-content:center;gap:14px;text-align:center}
/* Sécurité anti-transparence (Safari) : on cache la face inactive */
.lc-3d.flipped .lc:not(.lc-verso){opacity:0}
.lc-3d:not(.flipped) .lc-verso{opacity:0}
.lc-float{animation:lcLevit 6s ease-in-out infinite;will-change:transform}
@keyframes lcLevit{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-9px) rotate(.6deg)}}
.lc-tilt{transition:transform .18s cubic-bezier(.22,1,.36,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.lc-shimmer{position:absolute;inset:0;background:linear-gradient(105deg,transparent 34%,rgba(255,255,255,.28) 50%,transparent 66%);animation:lcShim 4.6s ease-in-out infinite;pointer-events:none;z-index:2}
@keyframes lcShim{0%{transform:translateX(-130%) skewX(-14deg)}55%,100%{transform:translateX(230%) skewX(-14deg)}}
.lc-back-qr{background:rgba(255,255,255,.95);border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 22px rgba(0,0,0,.3);position:relative;z-index:1}

.lc-bottom{position:relative;z-index:1}

.stats{margin:14px 20px;display:flex;gap:1px;background:var(--b1);border-radius:var(--r2);overflow:hidden;border:1px solid var(--b1)}
.stat{flex:1;background:var(--s2);padding:13px 10px;text-align:center}

.section{padding:0 20px;margin-top:20px}
.sec-title{font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:700;margin-bottom:12px}
.qr-section{background:var(--s2);border:1px solid var(--b2);border-radius:var(--r2);padding:20px;text-align:center}
.qr-big-wrap{background:#fff;border-radius:12px;padding:10px;display:inline-block;box-shadow:0 4px 20px rgba(0,0,0,.4);margin-bottom:10px}
.not-found{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
.nf-icon{font-size:3rem;margin-bottom:16px;opacity:.3}
.nf-title{font-family:'Montserrat',sans-serif;font-size:1.3rem;font-weight:700;margin-bottom:8px}
.nf-sub{font-size:.82rem;color:var(--tx2);line-height:1.6;margin-bottom:24px}
.nf-btn{background:var(--green);color:#fff;border:none;border-radius:var(--r);padding:14px 24px;font-family:'Inter',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer}
.cta-row{display:flex;gap:10px;padding:16px 20px 0}
.cta{flex:1;padding:15px;border-radius:var(--r);border:none;font-family:'Inter',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.cta-primary{background:var(--green);color:#fff}
.cta-ghost{background:var(--s2);color:var(--tx2);border:1px solid var(--b2)}
.reward-banner{background:rgba(245,200,66,.06);border:1.5px solid rgba(245,200,66,.25);border-radius:var(--r2);padding:16px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.reward-banner .rb-glow{position:absolute;inset:0;background:radial-gradient(160px 80px at 50% -10%,rgba(245,200,66,.34),transparent 70%);pointer-events:none;animation:rbPulse 3.2s ease-in-out infinite}

.reward-banner .rb-conf{position:absolute;top:-10px;width:6px;height:10px;border-radius:2px;opacity:0;animation:rbFall 2.8s ease-in infinite;pointer-events:none}
@keyframes rbFall{0%{opacity:0;transform:translateY(0) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translateY(130px) rotate(320deg)}}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;display:flex;flex-direction:column;gap:7px;align-items:center}
.toast{background:var(--s3);border:1px solid var(--b2);border-radius:var(--r);padding:10px 18px;font-size:.8rem;font-weight:500;animation:tIn .3s ease;white-space:nowrap;display:flex;align-items:center;gap:7px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.ok{border-left:3px solid var(--green2);color:var(--green3)}
@keyframes tIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.btn-wallet-lc{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#000;color:#fff;border:none;border-radius:12px;padding:14px 20px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;margin-top:10px;-webkit-tap-highlight-color:transparent}
.btn-google-lc{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#fff;color:#000;border:1px solid #dadce0;border-radius:12px;padding:14px 20px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;margin-top:8px;-webkit-tap-highlight-color:transparent}
.btn-wa-lc{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#25D366;color:#fff;border:none;border-radius:12px;padding:14px 20px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;margin-top:8px}
.wallet-toast-lc{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:100px;font-size:14px;transition:transform .3s;z-index:9999;pointer-events:none}
.wallet-toast-lc.show{transform:translateX(-50%) translateY(0)}
</style>

// ── LIRE LE CODE depuis ?code= ou le path
function getCode(){
  const p = new URLSearchParams(window.location.search);
  if(p.get('code')) return p.get('code');
  if(p.get('u'))    return p.get('u');
  const segs = window.location.pathname.split('/').filter(x=>x&&x!=='c'&&x!=='index.html');
  if(segs.length) return segs[segs.length-1];
  return null;
}

const esc = s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function qrSvg(text,size=64){
  try{
    const tmp=document.createElement('div');
    tmp.style.position='fixed';
    tmp.style.left='-9999px';
    tmp.style.top='-9999px';
    document.body.appendChild(tmp);
    new QRCode(tmp,{text,width:size,height:size,colorDark:'#061206',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
    const img=tmp.querySelector('img');
    const canvas=tmp.querySelector('canvas');
    let src='';
    if(img&&img.src)src=img.src;
    else if(canvas&&typeof canvas.toDataURL==='function')src=canvas.toDataURL('image/png');
    tmp.remove();
    if(src)return `<img src="${src}" width="${size}" height="${size}" style="display:block;width:${size}px;height:${size}px"/>`;
  }catch(e){}
  return `<div style="width:${size}px;height:${size}px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:10px;font-family:monospace">${esc(text)}</div>`;
}

function getTier(pts){
  if(pts>=500)return{n:'Platinum',ic:'ic-star'};
  if(pts>=200)return{n:'Gold',ic:'ic-medal'};
  if(pts>=50) return{n:'Silver',ic:'ic-medal'};
  return{n:'Bronze',ic:'ic-medal'};
}
function tierIcoSvg(t){return '<svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-1px;margin-right:3px"><use href="#'+(t.ic||'ic-medal')+'"></use></svg>';}

async function loadCard(code){
  try{
    // Lecture sécurisée via RPC public (la table n'est plus exposée en direct)
    const H={'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'};
    const card=await fetch(`${SB_URL}/rest/v1/rpc/get_card_public`,{method:'POST',headers:H,body:JSON.stringify({p_code:code})}).then(r=>r.json());
    if(!card||!card.code) return null;
    const merchant=card.merchant||{};

    // Couleur de marque : depuis le RPC get_card_public si présente,
    // sinon RPC additif get_card_brand, sinon repli vert MySargal.
    let brand=(merchant.brand&&typeof merchant.brand==='object'&&merchant.brand.bg1)?merchant.brand:null;
    if(!brand){
      try{
        const bj=await fetch(`${SB_URL}/rest/v1/rpc/get_card_brand`,{method:'POST',headers:H,body:JSON.stringify({p_code:code})}).then(r=>r.json());
        if(bj&&typeof bj==='object'&&bj.bg1) brand=bj;
      }catch(e){}
    }
    // logo_invert : certaines maisons ont un logo noir sur fond transparent.
    // Pose tel quel sur une carte sombre, il disparait purement et simplement.
    // Le drapeau existait deja pour les cartes Wallet, il manquait ici.
    const safeBrand=(brand&&brand.bg1)?{
      bg1:brand.bg1||'#1a1a2e',
      bg2:brand.bg2||brand.bg1||'#0f3460',
      accent:brand.accent||'#22c55e',
      text:brand.text||'#ffffff',
      logo_invert:brand.logo_invert===true
    }:{bg1:'#1a1a2e',bg2:'#0f3460',accent:'#22c55e',text:'#ffffff',logo_invert:false};

    const threshold=merchant.threshold||10;
    const pts=card.pts||0;
    const lifetime=card.lifetime_pts||0;
    const remaining=Math.max(0,threshold-pts);
    const pct=Math.min(100,Math.round((pts/threshold)*100));

    return {
      code:card.code,
      client_name:card.client_name||'Client',
      pts,
      lifetime_pts:lifetime,
      remaining_pts:remaining,
      progress_pct:pct,
      reward_ready:pts>=threshold,
      cashback_balance:Number(card.cashback_balance||0),
      rewards:Array.isArray(card.rewards)?card.rewards:[],
      history:Array.isArray(card.history)?card.history:[],
      boost:card.boost||null,
      design_url:card.design_url||null,
      hide_overlay:card.hide_overlay||false,
      google_wallet_link:card.google_wallet_link||null,
      merchant:{
        id:merchant.id||card.merchant_id||null,
        name:merchant.name||'',
        emoji:merchant.emoji||'🏪',
        logo_url:merchant.logo_url||null,
        logo_base64:merchant.logo_base64||null,
        reward_desc:merchant.reward_desc||'',
        phone:merchant.phone||null,
        whatsapp:merchant.whatsapp||null,
        website:merchant.website||null,
        threshold:threshold,
        cashback_enabled:merchant.cashback_enabled===true,
        cashback_threshold:Number(merchant.cashback_threshold||0),
        brand:safeBrand
      }
    };
  }catch(e){
    console.error('loadCard error:',e);
    return null;
  }
}

// Applique la couleur de marque aux accents de la page (boutons, valeurs, theme-color)
function applyBrandTheme(b){
  try{
    if(!b||!b.accent)return;
    const root=document.documentElement;
    // Boutons primaires : on prend le 2e ton du dégradé (foncé/saturé → contraste OK avec texte blanc)
    if(b.bg2){ root.style.setProperty('--green', b.bg2); }
    // Accents (valeurs de stats, surbrillances)
    root.style.setProperty('--green2', b.accent);
    root.style.setProperty('--green3', b.accent);
    // Ambiance de fond + bordures teintées
    const hx=String(b.bg2||'').replace('#','');
    if(hx.length===6){
      const r=parseInt(hx.slice(0,2),16),g=parseInt(hx.slice(2,4),16),bl=parseInt(hx.slice(4,6),16);
      root.style.setProperty('--glow', `rgba(${r},${g},${bl},.14)`);
      root.style.setProperty('--b1', `rgba(${r},${g},${bl},.08)`);
      root.style.setProperty('--b2', `rgba(${r},${g},${bl},.16)`);
      root.style.setProperty('--b3', `rgba(${r},${g},${bl},.28)`);
    }
    const m=document.querySelector('meta[name=theme-color]');
    if(m && document.documentElement.getAttribute('data-theme')!=='light' && b.bg1){ m.setAttribute('content', b.bg1); }
  }catch(e){}
}

      <div style="display:flex;align-items:center;gap:10px">

          ${!data.hide_overlay?`
          <div class="lc-top">
            <div style="display:flex;align-items:center;gap:9px">
              ${(()=>{const logo=MS.safeImgSrc?MS.safeImgSrc(data.merchant?.logo_url||data.merchant?.logo_base64):(function(u){const v=String(u||'').trim();return (/^data:image\/(png|jpe?g|gif|webp|svg\+xml);/i.test(v)||/^https:\/\//i.test(v))?v:'';})(data.merchant?.logo_url||data.merchant?.logo_base64);return logo
                ?`<img src="${MS.escAttr(logo)}" style="height:36px;max-width:130px;width:auto;object-fit:contain;display:block${data.merchant?.brand?.logo_invert?';filter:brightness(0) invert(1)':''}"/>`

          </div>

                  ? '<svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:4px"><use href="#ic-gift"></use></svg>Cashback : '+fmtF(cbBal)+(cbReady?' · utilisable':'')
                  : (hasRwd?'<svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:4px"><use href="#ic-gift"></use></svg>Récompense disponible !':'encore '+data.remaining_pts+' pts → '+esc(data.merchant?.reward_desc||''))}
              </div>
            </div>
          </div>

            <div style="display:flex;align-items:center;justify-content:space-between">
              <div class="lc-code">${esc(data.code)}</div>
              <div style="font-family:'Montserrat',sans-serif;font-size:.5rem;font-weight:700;color:rgba(255,255,255,.25)">My<span style="opacity:.6">Sargal</span></div>

    ${data.boost?`<div class="section"><div style="background:linear-gradient(135deg,rgba(239,68,68,.1),rgba(245,158,11,.1));border:1.5px solid rgba(245,158,11,.4);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px"><div style="display:flex"><svg viewBox="0 0 24 24" style="width:28px;height:28px;stroke:#f59e0b;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><use href="#ic-fire"></use></svg></div><div><div style="font-size:.9rem;font-weight:800;color:#f59e0b">Points x${Number(data.boost.x)||2} en ce moment !</div><div style="font-size:.72rem;color:var(--tx3)">Chaque achat rapporte ${Number(data.boost.x)||2} fois plus de points — jusqu'au ${new Date(data.boost.until).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}.</div></div></div></div>`:''}

        :`<div class="section"><div style="background:var(--s2,#fff);border:1px solid var(--b1,#e3ece6);border-radius:14px;padding:14px 16px;text-align:center"><div style="font-size:.9rem;font-weight:800;color:var(--tx,#0b140d)">Cashback : ${fmtF(cbBal)}</div><div style="font-size:.72rem;color:var(--tx3,#7d9284);margin-top:3px">${cbThresh>0?('Utilisable dès '+fmtF(cbThresh)+' de cashback.'):'Continuez à cumuler.'}</div></div></div>`)
      : (hasRwd?`<div class="section"><div class="reward-banner"><div class="rb-glow"></div>${Array.from({length:10},(_,i)=>'<span class="rb-conf" style="left:'+(6+i*9)+'%;animation-delay:'+(i*0.22).toFixed(2)+'s;background:'+['#f5c842','#22c55e','#4ade80','#ffffff','#f59e0b'][i%5]+'"></span>').join('')}<div style="display:flex;position:relative;z-index:1"><svg viewBox="0 0 24 24" style="width:30px;height:30px;stroke:var(--gold,#f5c842);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><use href="#ic-trophy"></use></svg></div><div style="position:relative;z-index:1"><div style="font-size:.95rem;font-weight:800;color:var(--gold2,#f5c842);margin-bottom:3px">Récompense débloquée</div><div style="font-size:.75rem;color:var(--gold2)">Montre cette page au commerçant : <strong>${esc(data.merchant?.reward_desc||'')}</strong></div></div></div></div>`:'')}

    ${(data.rewards&&data.rewards.length)?`<div class="section">

    ${(()=>{const ph=String(data.merchant?.whatsapp||data.merchant?.phone||'').replace(/[^0-9]/g,'').replace(/^00/,'');if(!ph)return '';const msg=encodeURIComponent('Bonjour '+(data.merchant?.name||'')+', je suis client(e) fidélité MySargal.');return `<a class="btn-wa-lc" href="https://wa.me/${ph}?text=${msg}" target="_blank" rel="noopener" style="margin:10px 16px 0;width:calc(100% - 32px);background:linear-gradient(135deg,#128c4b,#25d366)"><svg width="18" height="18" fill="white" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg> Contacter ${esc(data.merchant?.name||'la boutique')} sur WhatsApp</a>`;})()}
    ${(()=>{let w=String(data.merchant?.website||'').trim();if(!w)return '';if(!/^https?:\/\//i.test(w))w='https://'+w;if(!/^https?:\/\/[a-z0-9.-]+\.[a-z]{2,}([\/?#].*)?$/i.test(w))return '';return `<a class="btn-wa-lc" href="${esc(w)}" target="_blank" rel="noopener" style="margin:10px 16px 0;width:calc(100% - 32px);background:linear-gradient(135deg,#1f2b3f,#3b5375)"><svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.9 5.7 3.9 9S14.5 18.4 12 21M12 3c-2.5 2.6-3.9 5.7-3.9 9s1.4 6.4 3.9 9"></path></svg> Visiter le site ${data.merchant?.name?('· '+esc(data.merchant.name)):''}</a>`;})()}
    <div id="card-push"></div>

  `;

  if(window.msThemeUI)msThemeUI();
  try{ if(window.msCardPushUI) msCardPushUI(data.code, data.merchant?.name||''); }catch(e){}
  initLCWallet(data.code, data.pts, data.merchant?.threshold||10, data.merchant?.name||'MySargal', data.client_name, data.google_wallet_link);
  // Un seul bouton Wallet selon la plateforme (les deux restent visibles sur ordinateur)
  try{
    var ua=navigator.userAgent;
    var isIOS=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

    if(isIOS){var g=document.getElementById('lc-google-btn');if(g)g.style.display='none';}
    else if(isAndroid){var a=document.getElementById('lc-wallet-btn');if(a)a.style.display='none';}

  setTimeout(()=>{
    const wrap=document.getElementById('lc-back-qr');

      try{new QRCode(wrap,{text:data.code,width:150,height:150,colorDark:'#061206',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}
      catch(e){wrap.innerHTML=qrSvg(data.code,150);}
    }
  },100);
  // Carte animée : compteur de points + tilt 3D au pointeur
  try{
    var _p=document.querySelector('.lc-pts');
    if(_p){var _to=+(data.pts||0),_t0=performance.now();(function _s(t){var k=Math.min(1,(t-_t0)/1100),e=1-Math.pow(1-k,3);_p.textContent=Math.round(_to*e);if(k<1)requestAnimationFrame(_s);})(_t0);}
    var _tl=document.getElementById('lc-tilt');
    if(_tl){
      _tl.addEventListener('pointermove',function(ev){
        var r=_tl.getBoundingClientRect();
        var px=(ev.clientX-r.left)/r.width-0.5, py=(ev.clientY-r.top)/r.height-0.5;
        _tl.style.transform='rotateY('+(px*10).toFixed(2)+'deg) rotateX('+(-py*10).toFixed(2)+'deg)';
      });
      _tl.addEventListener('pointerleave',function(){_tl.style.transform='';});
    }
  }catch(e){}

function lcFlip(){ document.getElementById('lc3d')?.classList.toggle('flipped'); }

function renderNotFound(code){
  document.getElementById('app').innerHTML=`
    <div class="not-found">
      <div class="nf-icon" style="display:flex;justify-content:center"><svg viewBox="0 0 24 24" style="width:48px;height:48px;stroke:var(--tx3);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><use href="#ic-search"></use></svg></div>
      <div class="nf-title">Carte introuvable</div>
      <div class="nf-sub">Le code <strong style="color:var(--tx2);font-family:'DM Mono',monospace">${esc(code||'—')}</strong><br>ne correspond à aucune carte.</div>
      <button class="nf-btn" onclick="window.location.href='/'">Découvrir MySargal</button>
    </div>`;
}

function share(code,name){
  const url=window.location.href;
  if(navigator.share){navigator.share({title:'Ma carte MySargal — '+name,url}).catch(()=>{});}
  else{navigator.clipboard?.writeText(url);toast('Lien copié !');}
}

function toast(msg){
  const w=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast ok';el.textContent='✓ '+msg;
  w.appendChild(el);setTimeout(()=>el.remove(),3000);
}

async function init(){
  const code=getCode();
  if(!code){renderNotFound('');document.getElementById('loader').classList.add('hide');return;}
  // Une carte cadeau (GC-) a sa propre page → on redirige au lieu d'afficher "introuvable"
  if(/^GC-/i.test(code.trim())){window.location.replace('/giftcard.html?code='+encodeURIComponent(code.trim().toUpperCase()));return;}
  const data=await loadCard(code);
  if(!data||data.error){renderNotFound(code);document.getElementById('loader').classList.add('hide');return;}
  render(data);
  setTimeout(()=>document.getElementById('loader').classList.add('hide'),400);
}

init();
</script>

<script>
/* ═══ Notifications de la boutique (Web Push) ═══
   Le client arrive ici depuis WhatsApp : c'est le meilleur endroit pour
   lui proposer d'être prévenu des offres de CETTE boutique. */
(function(){
  const SB='https://iiocxlvcuoqafzlisqwd.supabase.co';

  if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }

  function u8(b64){
    const pad='='.repeat((4-b64.length%4)%4);
    const b=(b64+pad).replace(/-/g,'+').replace(/_/g,'/');
    const raw=atob(b); const out=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
    return out;
  }
  const supported=()=>('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);
  const isIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent);
  const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;

  async function status(){
    if(!supported()) return 'unsupported';
    if(Notification.permission==='denied') return 'denied';
    try{
      const reg=await navigator.serviceWorker.ready;
      return (await reg.pushManager.getSubscription())?'on':'off';
    }catch(e){ return 'off'; }
  }

  window.msCardPushToggle=async function(code, merchant){
    const st=await status();
    if(st==='on'){
      if(!confirm('Ne plus recevoir les offres de '+(merchant||'cette boutique')+' ?')) return;
      try{
        const reg=await navigator.serviceWorker.ready;
        const sub=await reg.pushManager.getSubscription();
        if(sub){
          await fetch(SB+'/functions/v1/push-subscribe?remove=1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})});
          await sub.unsubscribe();
        }
      }catch(e){}
      return msCardPushUI(code, merchant);
    }
    if(st==='denied'){ alert("Les notifications sont bloquées pour ce site. Autorisez-les dans les réglages de votre navigateur."); return; }
    if(st==='unsupported'){ alert("Votre navigateur ne gère pas les notifications."); return; }
    if(isIOS()&&!standalone()){
      alert("Sur iPhone : appuyez sur Partager, puis « Sur l'écran d'accueil ». Ouvrez la carte depuis l'icône et réessayez.");
      return;
    }
    try{
      const perm=await Notification.requestPermission();
      if(perm!=='granted') return msCardPushUI(code, merchant);
      const reg=await navigator.serviceWorker.ready;
      let sub=await reg.pushManager.getSubscription();
      if(!sub){
        const kd=await fetch(SB+'/functions/v1/push-subscribe').then(r=>r.json());
        if(!kd||!kd.public_key){ alert("Service indisponible, réessayez plus tard."); return; }
        sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(kd.public_key)});
      }
      const j=sub.toJSON();
      const rs=await fetch(SB+'/functions/v1/push-subscribe',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({endpoint:j.endpoint,keys:j.keys,card_code:code||null}),
      });
      // Ne jamais échouer en silence : sinon le navigateur se croit abonné
      // alors que le serveur ne connaît pas l'appareil.
      const rj=await rs.json().catch(()=>({}));
      if(!rs.ok||!rj.success){
        try{ await sub.unsubscribe(); }catch(_){}
        alert("Enregistrement impossible : "+(rj.error||('erreur '+rs.status))+"\nRéessayez dans un instant.");
      }
    }catch(e){ alert("Activation impossible : "+(e.message||'')); }
    msCardPushUI(code, merchant);
  };

  /* Re-synchronise l'abonnement local avec le serveur.
     Indispensable : si l'appareil s'est abonné mais que l'enregistrement
     serveur a échoué, le navigateur se croit abonné et plus rien ne repart.
     On renvoie donc l'abonnement à chaque ouverture de la carte (idempotent). */
  async function resync(code){
    try{
      const reg=await navigator.serviceWorker.ready;
      const sub=await reg.pushManager.getSubscription();
      if(!sub) return;
      const j=sub.toJSON();
      await fetch(SB+'/functions/v1/push-subscribe',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({endpoint:j.endpoint,keys:j.keys,card_code:code||null}),
      });
    }catch(e){}
  }

  window.msCardPushUI=async function(code, merchant){
    const el=document.getElementById('card-push');
    if(!el) return;
    const st=await status();
    if(st==='unsupported'){ el.innerHTML=''; return; }
    const on=(st==='on');
    if(on) resync(code);
    const nom=(merchant||'la boutique');

    el.innerHTML='';
    const btn=document.createElement('button');
    btn.type='button';
    btn.style.cssText='width:calc(100% - 32px);margin:10px 16px 0;display:flex;align-items:center;justify-content:center;gap:8px;'
      +'padding:14px;border-radius:14px;font-family:inherit;font-size:.86rem;font-weight:700;cursor:pointer;'
      +'border:1.5px solid '+(on?'rgba(150,150,150,.25)':'rgba(34,197,94,.35)')+';'
      +'background:'+(on?'transparent':'rgba(34,197,94,.10)')+';'
      +'color:'+(on?'var(--tx3,#8a9)':'var(--green2,#22c55e)')+';';
    btn.innerHTML='<svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><use href="#ic-chat"></use></svg><span></span>';
    btn.querySelector('span').textContent = on ? 'Notifications activées' : ('Être prévenu des offres ' + nom);
    btn.addEventListener('click', function(){ msCardPushToggle(code, nom); });
    el.appendChild(btn);
  };
})();
</script>
